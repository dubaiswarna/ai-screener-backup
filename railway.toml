[build]
builder = "nixpacks"
buildCommand = "echo 'Build optimized for Railway'"

[deploy]
startCommand = "streamlit run enhanced_screener.py --server.port $PORT --server.address 0.0.0.0 --server.headless true"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
healthcheckPath = "/"
healthcheckTimeout = 300

