# Railway Configuration
# This file configures Railway deployment

[build]
builder = "nixpacks"

[deploy]
startCommand = "python api_server.py"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
healthcheckPath = "/health"
healthcheckTimeout = 300

# Note: For multi-service deployment (backend + frontend),
# create separate services in Railway dashboard:
# 1. Backend service (root directory: /)
# 2. Frontend service (root directory: /frontend)
